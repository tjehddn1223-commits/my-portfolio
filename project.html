<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>Project Detail</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@400;500;600;700&display=swap");

      :root {
        --paper:#fbfbfa; --wash:#f2f2ef; --dark:#141413;
        --ink:#111; --ink-2:#3c3c39; --ink-3:#6d6d68; --ink-4:#9b9b95;
        --line:#e3e3df; --line-2:#cfcfc9;
        --ff:"Outfit","Noto Sans KR",sans-serif;
        --fk:"Noto Sans KR",sans-serif;
      }
      * { box-sizing:border-box; }
      html { background:var(--paper); -webkit-text-size-adjust:100%; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--ff); font-size:15px; line-height:1.68; }
      a { color:inherit; }

      /* ---------- top bar ---------- */
      .bar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:1rem; padding:.62rem clamp(1rem,4vw,3rem); background:rgba(251,251,250,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
      .bar a.home { display:inline-flex; align-items:center; gap:.38rem; font-size:.76rem; font-weight:600; text-decoration:none; letter-spacing:-.01em; }
      .bar a.home:hover { text-decoration:underline; }
      .bar .now { min-width:0; overflow:hidden; color:var(--ink-3); font-family:var(--fk); font-size:.74rem; font-weight:500; letter-spacing:-.04em; text-overflow:ellipsis; white-space:nowrap; }
      .bar .dots { display:flex; gap:.3rem; margin-left:auto; }
      .bar .dots a { width:1.55rem; height:1.55rem; display:grid; place-items:center; border:1px solid var(--line-2); border-radius:50%; color:var(--ink-3); font-size:.66rem; font-weight:600; text-decoration:none; }
      .bar .dots a[aria-current="page"] { color:#fff; background:var(--dark); border-color:var(--dark); }

      .wrap { max-width:1180px; margin:0 auto; padding:0 clamp(1rem,4vw,3rem) 3rem; }

      /* ---------- hero ---------- */
      .hero { padding:clamp(1.6rem,3.6vw,2.9rem) 0 0; }
      .eyebrow { display:flex; flex-wrap:wrap; align-items:center; gap:.55rem; margin:0 0 .85rem; color:var(--ink-4); font-size:.68rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase; }
      .eyebrow span.tag { padding:.1rem .45rem; color:var(--ink-2); background:var(--wash); border:1px solid var(--line); border-radius:2px; letter-spacing:.06em; }
      h1 { max-width:19ch; margin:0 0 .75rem; font-family:var(--fk); font-size:clamp(1.95rem,4.1vw,3.35rem); font-weight:800; letter-spacing:-.075em; line-height:1.08; word-break:keep-all; }
      .lede { max-width:56ch; margin:0 0 clamp(1.3rem,2.6vw,1.9rem); color:var(--ink-2); font-family:var(--fk); font-size:clamp(.95rem,1.25vw,1.12rem); font-weight:500; letter-spacing:-.045em; line-height:1.72; word-break:keep-all; }

      .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:1px; margin:0; background:var(--line); border:1px solid var(--line); }
      .meta > div { padding:.72rem .85rem; background:var(--paper); }
      .meta dt { margin-bottom:.32rem; color:var(--ink-4); font-size:.63rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
      .meta dd { margin:0; font-family:var(--fk); font-size:.79rem; font-weight:500; letter-spacing:-.045em; line-height:1.52; word-break:keep-all; }

      /* ---------- stats ---------- */
      .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; margin-top:1px; background:var(--line); border:1px solid var(--line); border-top:0; }
      .stats > div { padding:.9rem .85rem 1rem; background:var(--wash); }
      .stats b { display:block; font-size:clamp(1.25rem,2.1vw,1.6rem); font-weight:700; letter-spacing:-.045em; line-height:1.15; }
      .stats .lbl { margin-top:.2rem; font-family:var(--fk); font-size:.75rem; font-weight:600; letter-spacing:-.04em; }
      .stats .sub { margin-top:.35rem; color:var(--ink-3); font-family:var(--fk); font-size:.69rem; letter-spacing:-.04em; line-height:1.5; word-break:keep-all; }

      /* ---------- section ---------- */
      .sec { padding:clamp(1.5rem,2.9vw,2.3rem) 0 0; }
      .sec-head { display:flex; align-items:baseline; gap:.65rem; padding-top:.85rem; margin-bottom:1.05rem; border-top:1px solid var(--line-2); }
      .sec-head .num { font-size:.68rem; font-weight:600; color:var(--ink-4); letter-spacing:.06em; }
      .sec-head h2 { margin:0; font-family:var(--fk); font-size:.93rem; font-weight:700; letter-spacing:-.05em; }
      .sec-head .aside { margin-left:auto; color:var(--ink-4); font-family:var(--fk); font-size:.7rem; letter-spacing:-.04em; text-align:right; }

      p { margin:0 0 .75rem; }
      p:last-child { margin-bottom:0; }
      .prose { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:.2rem 2.6rem; color:var(--ink-2); font-family:var(--fk); font-size:.86rem; letter-spacing:-.045em; line-height:1.78; word-break:keep-all; }

      /* bullet blocks */
      .points { display:grid; grid-template-columns:repeat(auto-fit,minmax(243px,1fr)); gap:.55rem; margin-top:1.05rem; list-style:none; padding:0; }
      .points li { padding:.6rem .8rem; background:var(--wash); border-left:2px solid var(--ink); font-family:var(--fk); }
      .points b { display:block; margin-bottom:.16rem; font-size:.79rem; font-weight:700; letter-spacing:-.05em; }
      .points span { color:var(--ink-2); font-size:.76rem; letter-spacing:-.045em; line-height:1.62; word-break:keep-all; }

      /* role */
      .role { display:grid; grid-template-columns:minmax(0,.72fr) minmax(0,1.6fr); gap:0; border:1px solid var(--line-2); }
      .role .who { padding:1rem; background:var(--dark); color:#fff; }
      .role .who span { display:block; color:#9a9a93; font-size:.63rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
      .role .who b { display:block; margin-top:.4rem; font-family:var(--fk); font-size:1rem; font-weight:700; letter-spacing:-.06em; line-height:1.4; word-break:keep-all; }
      .role ul { margin:0; padding:.9rem 1rem .9rem 2rem; font-family:var(--fk); font-size:.82rem; letter-spacing:-.045em; line-height:1.72; color:var(--ink-2); word-break:keep-all; }
      .role li + li { margin-top:.4rem; }
      .role li::marker { color:var(--ink-4); }
      .role.deep { grid-template-columns:minmax(0,.52fr) minmax(0,2.15fr); }
      .role .role-body { padding:.9rem 1rem; }
      .role .role-body ul { margin:0 0 .95rem; padding:0 0 0 1.15rem; }
      .role .role-body ul:last-child { margin-bottom:0; }
      .role-grp { margin:0 0 .4rem; color:var(--ink-4); font-size:.63rem; font-weight:600; letter-spacing:.085em; text-transform:uppercase; }

      /* timeline */
      .flow { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
      .flow div { padding:.7rem .8rem .8rem; background:var(--paper); }
      .flow .when { color:var(--ink-4); font-size:.66rem; font-weight:600; letter-spacing:.02em; }
      .flow b { display:block; margin:.25rem 0 .28rem; font-family:var(--fk); font-size:.81rem; font-weight:700; letter-spacing:-.05em; }
      .flow span { color:var(--ink-3); font-family:var(--fk); font-size:.71rem; letter-spacing:-.045em; line-height:1.55; word-break:keep-all; }

      /* tables */
      .tbl-wrap { overflow-x:auto; }
      table { width:100%; border-collapse:collapse; font-family:var(--fk); font-size:.76rem; letter-spacing:-.04em; }
      caption { margin-bottom:.45rem; color:var(--ink-3); font-size:.71rem; text-align:left; letter-spacing:-.04em; }
      th, td { padding:.48rem .7rem; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; word-break:keep-all; }
      thead th { color:var(--ink-4); font-size:.65rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; border-bottom:1px solid var(--line-2); }
      tbody th { font-weight:700; white-space:nowrap; }
      tbody tr:last-child th, tbody tr:last-child td { border-bottom:0; }
      td.num, th.num { font-family:var(--ff); font-variant-numeric:tabular-nums; }

      /* figures */
      .figs { display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:.7rem; }
      figure { min-width:0; margin:0; padding:.45rem; background:var(--wash); border:1px solid var(--line); }
      figure a { display:block; }
      figure img { display:block; width:100%; height:180px; object-fit:contain; background:#fff; border:1px solid var(--line); cursor:zoom-in; }
      figcaption { margin-top:.45rem; padding:0 .12rem; color:var(--ink-2); font-family:var(--fk); font-size:.71rem; letter-spacing:-.045em; line-height:1.55; word-break:keep-all; }
      figcaption em { display:block; margin-top:.2rem; color:var(--ink-4); font-size:.65rem; font-style:normal; }

      /* findings */
      .finds { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:.1rem 2.4rem; margin:0; padding:0; list-style:none; counter-reset:f; }
      .finds li { display:grid; grid-template-columns:1.5rem minmax(0,1fr); gap:.1rem .6rem; padding:.68rem 0; border-top:1px solid var(--line); counter-increment:f; }
      .finds li::before { content:counter(f,decimal-leading-zero); grid-row:span 2; color:var(--ink-4); font-size:.68rem; font-weight:600; padding-top:.2rem; }
      .finds b { font-family:var(--fk); font-size:.8rem; font-weight:700; letter-spacing:-.05em; }
      .finds span { color:var(--ink-2); font-family:var(--fk); font-size:.77rem; letter-spacing:-.045em; line-height:1.68; word-break:keep-all; }

      /* outcome */
      .out { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:.7rem; }
      .out div { padding:.95rem 1rem 1.05rem; border:1px solid var(--line-2); }
      .out div:first-child { background:var(--dark); color:#fff; border-color:var(--dark); }
      .out div:first-child p { color:#dcdcd6; }
      .out b { display:block; margin-bottom:.4rem; color:var(--ink-4); font-size:.63rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
      .out div:first-child b { color:#8f8f88; }
      .out p { color:var(--ink-2); font-family:var(--fk); font-size:.78rem; letter-spacing:-.045em; line-height:1.68; word-break:keep-all; }

      /* pager */
      .pager { display:grid; grid-template-columns:1fr 1fr; gap:1px; margin-top:2rem; background:var(--line); border:1px solid var(--line); }
      .pager a { padding:.85rem 1rem; background:var(--paper); text-decoration:none; }
      .pager a:hover { background:var(--wash); }
      .pager a.next { text-align:right; }
      .pager span { display:block; color:var(--ink-4); font-size:.64rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; }
      .pager b { display:block; margin-top:.25rem; font-family:var(--fk); font-size:.85rem; font-weight:700; letter-spacing:-.06em; word-break:keep-all; }
      .pager a.empty { pointer-events:none; opacity:.35; }

      /* lightbox */
      #lb { position:fixed; inset:0; z-index:90; display:none; place-items:center; padding:2.2rem; background:rgba(16,16,15,.93); cursor:zoom-out; }
      #lb.on { display:grid; }
      #lb img { max-width:100%; max-height:100%; object-fit:contain; background:#fff; }
      #lb p { position:absolute; left:0; right:0; bottom:.75rem; margin:0; color:#d7d7d1; font-family:var(--fk); font-size:.74rem; letter-spacing:-.04em; text-align:center; }

      @media (max-width:760px) {
        .role { grid-template-columns:1fr; }
        .finds li { grid-template-columns:1.35rem minmax(0,1fr); }
        figure img { height:150px; }
      }
      @media (max-width:520px) { .bar .now { display:none; } }

      @media print {
        @page { size:A4; margin:12mm; }
        html, body { background:#fff; font-size:9.6pt; }
        .bar, .pager, #lb { display:none !important; }
        .wrap { max-width:none; padding:0; }
        figure img { height:34mm; }
        .sec, .finds li, figure, .out div, .role, table { break-inside:avoid; }
        .sec-head { break-after:avoid; }
        a { text-decoration:none; }
      }
    </style>
  </head>
  <body>
    <nav class="bar">
      <a class="home" href="index.html">← Portfolio</a>
      <span class="now" id="now"></span>
      <span class="dots" id="dots"></span>
    </nav>
    <main class="wrap" id="main"></main>
    <div id="lb" hidden><img alt="" /><p></p></div>

    <script>

            ["04", "주행거리 계산", "사용 가능 전력 용량 ÷ 주행 효율로 잔여 거리 산출"],

            ["fig-ev-accel.jpg", "가속도 구간별 실제 구동 파워와 주행 저항 파워. 저항은 완만한데 구동 파워만 가파르게 올라갑니다.", "결과보고서 p.15"],

            ["fig-ev-dash-main.jpg", "직접 구현한 HUD 메인 화면. 배터리 게이지 · 속도계 · 예상 주행거리 · 효율을 한눈에 배치했습니다.", "결과보고서 p.24"],
            ["fig-ev-dash-flow.jpg", "Power details > Flow. 현재 · 평균 · 피크 전력과 전력 분포를 함께 보여줍니다.", "결과보고서 p.25"],
            ["fig-ev-dash-regen.jpg", "Regen 서브페이지. 최근 10분 회생 전력 면적 그래프와 적분한 회수 에너지.", "결과보고서 p.26"]
          ],
          findings: [
            ["에너지는 속도와 가속도 양쪽에, 저항은 속도에만", "주행에 필요한 에너지는 속도와 가속도 모두에 비례하지만, 주행 저항은 속력에만 비례합니다. 그래서 급가속 구간에서 구동 파워만 가파르게 치솟는 형태가 나타납니다."],
            ["가속도가 SoC를 깎는다", "가속도가 커질수록 SoC 감소가 커졌고, 반대로 감속 과정에서는 회생제동으로 SoC가 충전되는 현상도 함께 확인됐습니다."],
            ["SoC 급락 집단의 정체", "SoC 급락 구간이 나타나는 집단은 높은 속도 분포와 더 큰 방전량 분포를 가졌습니다. 주요 변수는 속력 · 주행 저항 · HVAC · 급가속/감속이었습니다."],
            ["회생제동은 항상 쓰이지 않는다", "SoC가 높을수록 회생제동 비중이 줄어듭니다 — 과충전에 의한 배터리 열 폭주를 방지하기 위해서입니다. 급감속 시에도 회생 비중이 줄어드는데, 긴급 제동에는 유압 브레이크가 더 효과적이기 때문입니다."],
            ["에어컨은 주행과 무관하게 소모된다", "가속도가 증가해도 평균 에어컨 전력 소모는 증가하지 않고, 실내·외 온도와 설정 온도에만 반응했습니다. 덕분에 정차 중 소모량으로 주행 중 소모량을 가정할 수 있었습니다."],
            ["에어컨 부하의 크기", "전체 트립 기준 기본 시스템 −2.89 Wh, 에어컨 포함 −6.88 Wh, 순수 에어컨 −3.99 Wh. 에어컨 on/off가 변하는 트립만 보면 −3.16 / −7.66 / −4.50 Wh로 비슷한 비율이 유지됐습니다."],
            ["잔여 주행거리 계산식", "사용 가능 전력 용량[Wh] = Display SoC(%) × 18,800Wh, 남은 주행 가능 거리[km] = 사용 가능 전력 용량 ÷ 주행 효율[Wh/km]. 공칭 21.6 kWh 중 18.8 kWh만 쓰는 이유는 배터리 격자 구조 보호를 위한 안전 마진 때문입니다."],

            ["한계", "데이터 특성상 머신러닝 모델로 예측하기 어려웠고, 급가속이나 강한 회생제동 구간의 표본이 부족해 샘플 불균형이 발생했습니다. 서브페이지에서는 그래프 화면이 깜빡이는 플리커 현상도 있었습니다."],
            ["다음에 한다면", "트랜스포머 기반 딥러닝 모델로 예측을 다시 시도하고, 부족한 구간의 데이터를 의도적으로 보강하고 싶습니다. 플리커는 자동 리스케일을 막고 프레임을 조절해 해결할 수 있습니다."]
          ]
        }
      };

      /* ---------------- render ---------------- */
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const qid = new URLSearchParams(location.search).get("id");
      const id = ORDER.includes(qid) ? qid : ORDER[0];
      const i = ORDER.indexOf(id);
      const p = P[id];

      document.title = `${p.title} | Portfolio`;
      document.getElementById("now").textContent = p.title;
      document.getElementById("dots").innerHTML = ORDER
        .map((k, n) => `<a href="?id=${k}" title="${esc(P[k].title)}"${k === id ? ' aria-current="page"' : ""}>${n + 1}</a>`)
        .join("");

      let s = 0;
      const head = (t, aside) =>
        `<div class="sec-head"><span class="num">${String(++s).padStart(2, "0")}</span><h2>${t}</h2>${aside ? `<span class="aside">${aside}</span>` : ""}</div>`;
      const table = (t) =>
        `<div class="tbl-wrap"><table>${t.caption ? `<caption>${esc(t.caption)}</caption>` : ""}` +
        `<thead><tr>${t.head.map((h, n) => `<th${n ? ' class="num"' : ""}>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
        t.rows.map((r) => `<tr><th>${esc(r[0])}</th>${r.slice(1).map((c) => `<td class="num">${esc(c)}</td>`).join("")}</tr>`).join("") +
        `</tbody></table></div>`;

      const html = [
        `<section class="hero">
          <p class="eyebrow"><span>Project ${String(i + 1).padStart(2, "0")} / ${String(ORDER.length).padStart(2, "0")}</span><span class="tag">${esc(p.code)}</span></p>
          <h1>${esc(p.title)}</h1>
          <p class="lede">${esc(p.lede)}</p>
          <dl class="meta">${p.meta.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
          <div class="stats">${p.stats.map(([b, l, sub]) => `<div><b>${esc(b)}</b><div class="lbl">${esc(l)}</div><div class="sub">${esc(sub)}</div></div>`).join("")}</div>
        </section>`,

        `<section class="sec">${head("배경과 문제 정의")}
          <div class="prose">${p.background.map((t) => `<p>${esc(t)}</p>`).join("")}</div>
          <ul class="points">${p.problems.map(([t, d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ul>
        </section>`,

        `<section class="sec">${head("나의 역할")}
          <div class="role${p.role.groups ? " deep" : ""}">
            <div class="who"><span>Personal Contribution</span><b>${esc(p.role.who)}</b></div>
            ${p.role.groups
              ? `<div class="role-body">${p.role.groups.map((g) => `<p class="role-grp">${esc(g.label)}</p><ul>${g.items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`).join("")}</div>`
              : `<ul>${p.role.items.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`}
          </div>
        </section>`,

        `<section class="sec">${head("수행 절차")}
          <div class="flow">${p.flow.map(([w, t, d]) => `<div><div class="when">${esc(w)}</div><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div>
        </section>`,

        `<section class="sec">${head(id === "ev" ? "Feature Engineering" : "데이터와 전처리", esc(p.prep.head.join(" → ")))}
          ${table(p.prep)}
        </section>`,

        `<section class="sec">${head("분석 과정", "이미지를 클릭하면 크게 볼 수 있습니다")}
          <div class="figs">${p.figures.map(([src, cap, from]) =>
            `<figure><img src="assets/${src}" alt="${esc(cap)}" data-cap="${esc(cap)}" loading="lazy" /><figcaption>${esc(cap)}<em>${esc(from)}</em></figcaption></figure>`
          ).join("")}</div>
        </section>`,

        `<section class="sec">${head("핵심 결과")}
          <ol class="finds">${p.findings.map(([t, d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ol>
        </section>`,

        `<section class="sec">${head(p.extra.title)}
          ${table(p.extra)}
        </section>`,

        `<section class="sec">${head("결론과 회고")}
          <div class="out">${p.outcome.map(([t, d]) => `<div><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join("")}</div>
        </section>`,

        `<nav class="pager">
          ${i > 0
            ? `<a class="prev" href="?id=${ORDER[i - 1]}"><span>← Previous</span><b>${esc(P[ORDER[i - 1]].title)}</b></a>`
            : `<a class="prev empty" href="#"><span>← Previous</span><b>—</b></a>`}
          ${i < ORDER.length - 1
            ? `<a class="next" href="?id=${ORDER[i + 1]}"><span>Next →</span><b>${esc(P[ORDER[i + 1]].title)}</b></a>`
            : `<a class="next empty" href="#"><span>Next →</span><b>—</b></a>`}
        </nav>`
      ].join("");

      document.getElementById("main").innerHTML = html;

      /* ---------------- lightbox ---------------- */
      const lb = document.getElementById("lb");
      const lbImg = lb.querySelector("img");
      const lbCap = lb.querySelector("p");
      document.getElementById("main").addEventListener("click", (e) => {
        const img = e.target.closest("figure img");
        if (!img) return;
        lbImg.src = img.src;
        lbImg.alt = img.alt;
        lbCap.textContent = img.dataset.cap || "";
        lb.hidden = false;
        lb.classList.add("on");
      });
      const close = () => { lb.classList.remove("on"); lb.hidden = true; lbImg.src = ""; };
      lb.addEventListener("click", close);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    </script>
  </body>
</html>
